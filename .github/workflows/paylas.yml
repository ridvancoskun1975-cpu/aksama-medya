# Akşama Ne Var? günlük paylaşım (09:00 İstanbul). Günlük Gümüş düzeni: saati Google tutar, paylaşımı bu iş yapar.
# Rıdvan 17 Kas 09:27: "Saat Google'da, GitHub'ın kendi saati tamamen kapalı, yedek olarak bile yok. GitHub yalnız
# Google başlatınca paylaşır." · 09:29: "gunlukgumus gibi olacak!!!"
# Asıl başlatıcı Google Apps Script "Akşama dış tetik"tir (workflow_dispatch). Aşağıdaki iki saat yalnız YEDEKTİR
# (Rıdvan 17 Kas 10:24: "günlük paylaşım mutlaka çıkmalı. İptal edilme diye bir şey olamaz."; 10:29: "yedek aç"):
# Google bir sabah hiç çalışmazsa gönderiyi geç de olsa bu saatler çıkarır. Paylaşıldıysa iş kayıt etiketini görüp
# hemen çıkar; çift paylaşım olmaz. GitHub bu saatleri geç başlatabilir ya da atlayabilir; asıl iş onlara bağlı değildir.
# Başka saat eklenmez (akşam hazırlığı ve reel yalnız Google'dan).
#   akşam 20:00  yarının gönderisi Instagram'a yüklenir, paylaşılmaz (sorun akşamdan görülür)
#   sabah 08:15  akşamdan hazır kap 09:00'da paylaşılır; yoksa her şey sabah yapılır
#   nöbetçi      09:10, 09:40, 11:40, 14:40, 17:40: paylaşım çıkmadıysa Google yeniden başlatır
# İlk kare müzikli kapak videosudur (Rıdvan 18 Kas 12:54 "A"); video olmazsa resimli kapak (aşağıda "Kapak videosu").
# "Kesintisiz paylaşım" (Rıdvan 13 Kas 20:43: "kur"). Paylaşıldıysa iş kayıt etiketini görüp hemen çıkar.
# Kip: elle seçilmezse depo değişkeni PAYLASIM_KIPI (kontrol | prova | yayin; boşsa kontrol).
# Gerçek paylaşım yalnız PAYLASIM_KIPI=yayin iken yapılır (Rıdvan'ın açık onayı).
# Açık depo: günlüğe anahtar, menü ve açıklama yazılmaz. Değişiklik isteği (pull request) bu işi başlatamaz.
name: Paylaşım
run-name: "Paylaşım · ${{ (github.event.schedule == '0 17 * * *' || inputs.zaman == 'aksam') && 'akşam hazırlığı' || 'sabah' }} · ${{ github.event_name == 'schedule' && 'saat' || inputs.kip || 'otomatik' }}${{ inputs.tarih && format(' · {0}', inputs.tarih) || '' }}"

on:
  workflow_dispatch:
    inputs:
      kip:
        description: "otomatik = depo ayarı; kontrol = yalnız denetim; prova = paylaşmadan her şey; yayin = gerçek paylaşım"
        type: choice
        options: [otomatik, kontrol, prova, yayin]
        default: otomatik
      zaman:
        description: "sabah = paylaşım; aksam = yarının gönderisini hazırlar, paylaşmaz"
        type: choice
        options: [sabah, aksam]
        default: sabah
      tarih:
        description: "YYYY-AA-GG (boşsa: sabah bugün, akşam yarın). Sabah başka gün yalnız kontrol ve prova için."
        type: string
        required: false
  schedule:
    - cron: "5 6 * * *"     # 09:05 İstanbul: yedek (Google başlatmadıysa)
    - cron: "5 9 * * *"     # 12:05 İstanbul: ikinci yedek

permissions: {}

concurrency:
  group: paylasim
  cancel-in-progress: false

jobs:
  paylas:
    name: Paylaşım
    # GEÇİCİ POLİTİKA (Rıdvan 23 Kas 2026, yalnız bu proje): Instagram'a API ile paylaşım kapalı; iş başlatılsa da çalışmaz.
    # Otomatiğe dönüş yalnız Rıdvan'ın sözüyle: aşağıdaki "false && " kısmını sil (README "Geçici politika").
    if: false && github.repository == 'ridvancoskun1975-cpu/aksama-medya'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write     # kayıt etiketi paylasildi/<tarih>
      pages: write
      id-token: write
    environment:
      name: github-pages
    outputs:
      kip: ${{ steps.hazirla.outputs.kip }}
      asama: ${{ steps.hazirla.outputs.asama }}
      stok: ${{ steps.hazirla.outputs.stok }}
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      BOT_OKUMA: ${{ secrets.BOT_OKUMA }}
      KIP_GIRDI: ${{ inputs.kip || 'otomatik' }}
      KIP_AYARI: ${{ vars.PAYLASIM_KIPI }}
      ASAMA: ${{ (github.event.schedule == '0 17 * * *' || inputs.zaman == 'aksam') && 'aksam' || 'sabah' }}
      YZ_ETIKETI: ${{ vars.YZ_ETIKETI }}
      TARIH_GIRDI: ${{ inputs.tarih }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Hazırla (denetim, gün klasörü)
        id: hazirla
        timeout-minutes: 15
        run: python3 paylas/paylas.py hazirla

      - name: Kareleri Pages'e yükle
        if: steps.hazirla.outputs.pages_gerek == 'evet'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

      - name: Pages'e çıkar
        id: dagit
        if: steps.hazirla.outputs.pages_gerek == 'evet'
        timeout-minutes: 15
        uses: actions/deploy-pages@v5

      # Müzikli kapak videosu (Rıdvan 18 Kas 11:48: "Kaydırmalı ileti sesli müzikli tercıh ederim ama otomatik olacak.";
      # 12:54: "A" = yakınlaşma, maskot, buhar). Yalnız yeni kap kurulurken (akşam hazırlığı ya da kapsız sabah).
      # Bu üç adımın hiçbiri gönderiyi engellemez (continue-on-error): video yoksa, ilk karesi onaylı kapakla aynı
      # değilse ya da Instagram kabul etmezse gönderi resimli kapakla çıkar. Müzik lisansı yalnız Meta ürünleri:
      # video Pages'e ve esere (artifact) konmaz, Instagram'a doğrudan yüklenir. Açık depo: ayrıntılı çıktı günlüğe yazılmaz.
      - name: Kapak videosu için üretici (aksama-bot, yalnız okuma)
        id: bot
        if: steps.hazirla.outputs.yayina_hazir == 'evet' && steps.hazirla.outputs.pages_gerek == 'evet'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          repository: ridvancoskun1975-cpu/aksama-bot
          token: ${{ secrets.BOT_OKUMA }}
          path: bot
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            uretim
            maskot
            yazi-tipleri
            gorseller
            muzik
            tarifler
            gunler/${{ steps.hazirla.outputs.tarih }}

      - name: Kapak videosu için araçlar (Playwright, ffmpeg)
        id: araclar
        if: steps.bot.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 -m pip install --quiet playwright==1.63.0
          python3 -m playwright install --with-deps chromium > /dev/null
          command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)

      - name: Kapak videosu
        if: steps.araclar.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          TARIH: ${{ steps.hazirla.outputs.tarih }}
        run: |
          if python3 bot/uretim/kapak_video.py "bot/gunler/$TARIH" --hareket 1,2,3 --denetle \
               --cikti "$RUNNER_TEMP/kapak/kapak.mp4" > "$RUNNER_TEMP/kapak-gunluk.txt" 2>&1; then
            ls -l "$RUNNER_TEMP/kapak/kapak.mp4" | awk '{print "Kapak videosu: " int($5/1024) " KB"}'
            grep -o "PSNR [0-9.]* dB" "$RUNNER_TEMP/kapak-gunluk.txt" || true
          else
            grep -o "PSNR [0-9.]* dB" "$RUNNER_TEMP/kapak-gunluk.txt" || true
            echo "::warning::Kapak videosu üretilemedi; gönderi resimli kapakla çıkacak (ayrıntı açık günlüğe yazılmaz)."
            exit 1
          fi

      - name: Instagram (hazırlık, prova ya da paylaşım)
        if: steps.hazirla.outputs.yayina_hazir == 'evet'
        timeout-minutes: 330
        env:
          SAYFA_ADRESI: ${{ steps.dagit.outputs.page_url }}
          KAPAK_VIDEO: ${{ runner.temp }}/kapak/kapak.mp4
        run: python3 paylas/paylas.py yayinla

  stok:
    name: Hazır stok
    needs: paylas
    if: always() && needs.paylas.outputs.kip == 'yayin' && needs.paylas.outputs.asama == 'aksam' && needs.paylas.outputs.stok != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          STOK: ${{ needs.paylas.outputs.stok }}
        run: |
          echo "Hazır stok: $STOK gün"
          if [ "$STOK" -lt 3 ]; then echo "::error::Hazır stok $STOK gün (3'ün altında). Yeni günler hazırlanıp onaylanmalı."; exit 1; fi
