# Saat (schedule) ve iş zinciri (workflow_run) yoktur: bu işi Google Apps Script "Akşama dış tetik" başlatır
# (09:20; çıkmadıysa 11:40, 14:40, 17:40). Rıdvan 17 Kas 09:27: "GitHub yalnız Google başlatınca paylaşır."
# Günlük reel (Rıdvan 17 Kas 01:54: "Ben uğraşmak istemiyorum, sen yap." · "Edits iptal";
# 01:57: "Reels sen gönder. Takipçi kazanma odaklı. Hashtagler dikkat!!").
# Bugünün onaylı gönderisi paylaşıldıktan sonra (kayıt etiketi paylasildi/<bugün>) aynı menüden müzikli video
# üretilir ve Instagram'a doğrudan yüklenerek reel olarak kendiliğinden paylaşılır. Kilitler: reel/<tarih> etiketi
# + Instagram'daki son paylaşımlar. Müzik (Rıdvan 17 Kas 14:58: "bu müzikleri kullanacağız random olarak"):
# Meta Sound Collection, aksama-bot/muzik; lisans yalnız Meta ürünlerini kapsar, bu yüzden video Pages'e ya da başka
# açık adrese konmaz, eser (artifact) olarak da saklanmaz. Kapatma: paylas/reel.py INSTAGRAMA_PAYLAS = False.
# Paylaşım işinden ayrı: bu iş bozulsa da 09:00 gönderisi etkilenmez.
# Açık depo: günlüğe menü ve açıklama yazılmaz.
name: Reel
run-name: "Reel · ${{ inputs.kip }}${{ inputs.tarih && format(' · {0}', inputs.tarih) || '' }}"

on:
  workflow_dispatch:
    inputs:
      kip:
        description: "prova = video Instagram'a yüklenir ama paylaşılmaz; yayin = reel paylaşılır"
        type: choice
        options: [prova, yayin]
        default: prova
      tarih:
        description: "YYYY-AA-GG (boşsa bugün). Yalnız gönderisi paylaşılmış gün."
        type: string
        required: false

permissions: {}

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    name: Reel
    if: github.repository == 'ridvancoskun1975-cpu/aksama-medya'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write     # kayıt etiketi reel/<tarih>
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Gerek var mı
        id: gerek
        timeout-minutes: 3
        env:
          OLAY: ${{ github.event_name }}
          SONUC: ${{ github.event.workflow_run.conclusion }}
          KIP: ${{ inputs.kip }}
          TARIH_GIRDI: ${{ inputs.tarih }}
        run: python3 paylas/reel.py gerek

      - name: Günün klasörü ve üretici (aksama-bot, yalnız okuma)
        if: steps.gerek.outputs.gerek == 'evet'
        uses: actions/checkout@v7
        with:
          repository: ridvancoskun1975-cpu/aksama-bot
          token: ${{ secrets.BOT_OKUMA }}
          path: bot
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            uretim
            maskot
            yazi-tipleri
            gorseller
            muzik
            gunler/${{ steps.gerek.outputs.tarih }}

      # 19 Kas: bu adım GitHub'ın paket sunucusu yavaşken 8 dakikayı aştı ve reel o sabah çıkmadı; süre 15 dakika.
      - name: Araçlar (Playwright, ffmpeg)
        if: steps.gerek.outputs.gerek == 'evet'
        timeout-minutes: 15
        run: |
          python3 -m pip install --quiet playwright==1.63.0
          python3 -m playwright install --with-deps chromium > /dev/null
          command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)

      - name: Videoyu üret
        if: steps.gerek.outputs.gerek == 'evet'
        timeout-minutes: 6
        env:
          TARIH: ${{ steps.gerek.outputs.tarih }}
        run: |
          python3 bot/uretim/reel.py "bot/gunler/$TARIH" --cikti "$RUNNER_TEMP/reel/reel.mp4" > /dev/null
          ls -l "$RUNNER_TEMP/reel/reel.mp4" | awk '{print "Video: " int($5/1024) " KB"}'
          python3 -c "import json,sys; print('Müzik:', json.load(open(sys.argv[1])).get('muzik'))" "$RUNNER_TEMP/reel/reel.json" || echo "Müzik: yok"

      - name: Instagram'a reel
        if: steps.gerek.outputs.gerek == 'evet'
        timeout-minutes: 55
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YZ_ETIKETI: ${{ vars.YZ_ETIKETI }}
          KIP: ${{ steps.gerek.outputs.kip }}
          TARIH: ${{ steps.gerek.outputs.tarih }}
        run: python3 paylas/reel.py paylas "$TARIH" "bot/gunler/$TARIH" "$RUNNER_TEMP/reel/reel.mp4"

      # Ek gönderi (tanıtım gibi; paylas/ek.py): reel'den sonra aynı işte, ek/<ad>/ek.json'daki günden başlayarak
      # bir kez. Reel adımı başarısız biterse çalışmaz; reel zaten paylaşılmışsa (önceki adımlar atlandıysa) çalışır.
      # Bu adımın hatası reel'i etkilemez (reel önceki adımda paylaşılmış olur).
      - name: Ek gönderi
        timeout-minutes: 15
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YZ_ETIKETI: ${{ vars.YZ_ETIKETI }}
          KIP: ${{ steps.gerek.outputs.kip }}
        run: python3 paylas/ek.py
